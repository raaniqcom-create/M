<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Tajawal,system-ui,sans-serif;background:linear-gradient(135deg,#14532d 0%,#166534 45%,#16a34a 100%);color:#fff;position:relative}
  .glow{position:absolute;inset:auto -160px -220px auto;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.14),transparent)}
  .wrap{position:absolute;inset:0;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:18px;font-weight:800;font-size:34px}
  .brand img{width:64px;height:64px;border-radius:18px;background:#fff;padding:6px;box-sizing:border-box}
  h1{margin:0;font-size:96px;line-height:1.1;font-weight:900;letter-spacing:-1px}
  h1 small{display:block;font-size:40px;font-weight:700;opacity:.9;margin-top:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:40px}
  .plate{display:flex;align-items:stretch;border:5px solid #fff;border-radius:22px;overflow:hidden;background:#fff;color:#0f172a;height:132px;min-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .plate .tag{background:#14532d;color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;padding:0 24px}
  .plate .num{flex:1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:84px;letter-spacing:10px;direction:ltr}
  .url{font-size:38px;font-weight:800;direction:ltr;opacity:.95}
  .chips{display:flex;gap:14px;margin-top:22px}
  .chip{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 24px;font-size:28px;font-weight:700}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="../../public/icons/icon-192.png" alt=""> المحطة التقنية · منصّة وقود الأنبار</div>
  <div>
    <h1>اعرف دورك في البنزين<small>الفرديّ والزوجيّ — أدخل رقم سيارتك مرّةً واحدة</small></h1>
    <div class="chips"><span class="chip">دورك اليوم أم غداً</span><span class="chip">المحطات التي يصلها البنزين</span><span class="chip">الطريق إليها</span></div>
  </div>
  <div class="row">
    <div class="plate"><div class="tag">العراق</div><div class="num">2 3 4 5 7</div></div>
    <div class="url">muhta.online/dori</div>
  </div>
</div>
</body>
</html>

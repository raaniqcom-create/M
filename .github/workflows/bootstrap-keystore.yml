name: Bootstrap signing key

# Run once. Creates the keystore that signs every future APK, and prints the
# SHA-256 fingerprint that must go into assetlinks.json.
# The keystore itself leaves only as an artifact — never into this public repo.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore muhta.keystore \
            -alias muhta \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Al Mahatta Al Taqniya, OU=muhta.online, O=Al Mahatta Al Taqniya, L=Ramadi, ST=Anbar, C=IQ"

      - name: Print SHA-256 fingerprint
        run: |
          echo "--- assetlinks fingerprint ---"
          keytool -list -v -keystore muhta.keystore -alias muhta \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep 'SHA256:' | head -1

      - name: Encode for transport
        run: base64 -w0 muhta.keystore > keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
          retention-days: 1

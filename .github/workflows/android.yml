name: Build APK

# The APK is a Trusted Web Activity: a thin Chrome-backed shell around
# muhta.online. Site changes reach users immediately with no rebuild — only the
# icon, name or shell config below need one.
on:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore

      # Point bubblewrap at the runner's preinstalled SDKs, otherwise it stops
      # to ask permission to download its own copies.
      # Bubblewrap accepts an SDK root only if it contains `tools/` or `bin/`
      # (AndroidSdkTools.validatePath). Runners ship the modern layout, where
      # those binaries live under cmdline-tools/latest/bin, so link the name
      # bubblewrap looks for at the directory that actually holds them.
      - name: Configure bubblewrap
        run: |
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          ls -l "$ANDROID_HOME/bin/" | head -5

          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      # Bubblewrap regenerates the whole Android project from twa-manifest.json,
      # so none of it is committed.
      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@latest update --skipVersionUpgrade
          npx --yes @bubblewrap/cli@latest build --skipPwaValidation

      # Bubblewrap emits an unsigned APK alongside the signed one. Android
      # refuses to install unsigned packages, so name the signed file exactly
      # rather than globbing — a wildcard silently picks the wrong one.
      - name: Locate signed APK
        id: apk
        run: |
          signed=$(find . -name 'app-release-signed.apk' | head -1)
          if [ -z "$signed" ]; then
            echo "signed APK not produced — refusing to publish"
            find . -name '*.apk'
            exit 1
          fi
          cp "$signed" muhta.apk
          echo "path=muhta.apk" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Verify the APK really is signed
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs muhta.apk \
            | grep -i 'SHA-256 digest' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: muhta-apk-${{ steps.apk.outputs.stamp }}
          path: ${{ steps.apk.outputs.path }}

      # A release gives a stable public link to share on WhatsApp/Telegram.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.apk.outputs.stamp }}
          name: المحطة التقنية ${{ steps.apk.outputs.stamp }}
          body: |
            تطبيق المحطة التقنية لأندرويد.

            حمّل الملف أدناه وثبّته. عند ظهور تحذير «مصدر غير معروف» اسمح بالتثبيت — هذا طبيعي لأي تطبيق خارج المتجر.

            الموقع: https://muhta.online
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

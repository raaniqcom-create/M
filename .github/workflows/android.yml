name: Build APK

# A Capacitor WebView shell around muhta.online.
#
# Replaced the Trusted Web Activity build: a TWA renders through Chrome, so on
# a phone whose browser doesn't support it Android asks the user to pick a
# browser — which is not an app experience. A WebView never does that.
# Site updates still reach users instantly; the shell only loads the URL.
on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Capacitor generates the cordova plugin scaffolding, and its own
      # .gitignore keeps it out of the repo — without a sync the Gradle build
      # fails on a missing script. webDir only needs to exist: the shell loads
      # the live URL, not bundled assets.
      - name: Sync native project
        run: |
          mkdir -p out
          npx cap sync android

      # Firebase config is not in the repo (public), so restore it before the
      # Gradle plugin looks for it — without this the app builds fine but never
      # receives a device token.
      - name: Restore Firebase config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('firebase project:',d['project_info']['project_id'])"

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/muhta.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/muhta.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=muhta \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Locate and verify the signed APK
        id: apk
        run: |
          signed=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$signed" ]; then
            echo "no APK produced"; find android -name '*.apk'; exit 1
          fi
          cp "$signed" muhta.apk

          # Google Play accepts only the bundle format for new apps
          bundle=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$bundle" ]; then echo "no AAB produced"; find android -name "*.aab"; exit 1; fi
          cp "$bundle" muhta.aab

          # Android refuses to install an unsigned package, so prove it is
          # signed here rather than discovering it on a user's phone.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs muhta.apk

          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: muhta-${{ steps.apk.outputs.stamp }}
          path: |
            muhta.apk
            muhta.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.apk.outputs.stamp }}
          name: المحطة التقنية ${{ steps.apk.outputs.stamp }}
          body: |
            تطبيق المحطة التقنية لأندرويد.

            احذف أي نسخة سابقة ثم ثبّت هذه، لأن أندرويد يحتفظ بشاشة البدء القديمة.

            عند ظهور تحذير «مصدر غير معروف» اسمح بالتثبيت — طبيعي لأي تطبيق خارج المتجر.

            الموقع: https://muhta.online
          files: |
            muhta.apk
            muhta.aab
          fail_on_unmatched_files: true

project_id = "snlafcvuoxpxcdbtinsy"

# Who checks the caller's token: the gateway, or the function?
#
# The project's auth signing key was rotated from the legacy symmetric HS256 to
# an asymmetric ES256 key. GoTrue now issues ES256 access tokens, and the edge
# gateway's legacy `verify_jwt` path cannot verify them — it answers
# 401 UNAUTHORIZED_ASYMMETRIC_JWT before the function ever runs.
#
# Four functions were deployed with verify_jwt on, and all four broke at once:
#   health          — the admin's system panel, which then blamed the admin's account
#   rebuild         — so approving a station never regenerated the site, and the
#                     link handed to the owner 404'd while subscribers were told
#                     the station had joined
#   announce        — the broadcast
#   delete-account  — account deletion, which the App Store requires
#
# Turning the gateway check off removes nothing: each of these four reads the
# Authorization header itself, calls auth.getUser(jwt) against GoTrue (which
# does verify ES256), and rejects a non-admin with 403. That check is the real
# boundary; the gateway was a duplicate of it that no longer works.
#
# Every other function in this project already runs with verify_jwt = false.

[functions.health]
verify_jwt = false

[functions.rebuild]
verify_jwt = false

[functions.announce]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# يناديها pg_cron برأس x-cron-secret وحده، بلا Authorization — فبوابة JWT
# ترفضه قبل أن تعمل الدالة. والدالة تتحقق من السرّ بنفسها.
[functions.owner-daily]
verify_jwt = false

# الثلاث التالية كانت تعمل بـfalse على الخادم ولا يعلنها هذا الملفّ — وهو خطرٌ
# صامت: نشرٌ من المستودع يضبطها على الافتراضي فتموت بـ401 قبل أن تعمل شيفرتها.
# ولكلٍّ منها حارسُها الخاص، وهو البوابة الحقيقية لا JWT.

# تيليجرام لا ترسل ترويسة Authorization إطلاقاً. والحارس
# x-telegram-bot-api-secret-token في السطر 1350.
[functions.telegram]
verify_jwt = false

# ينادَى من المتصفّح برمز جلسة، ومن الدوالّ الطرفية بـx-cron-secret بلا
# Authorization — والثاني هو ما يجعل تبديل المنتج من البوت يصل الناس.
# والحارس callerMayAnnounce يفحص الاثنين بنفسه.
[functions.notify]
verify_jwt = false

# يناديها pg_cron كل دقيقتين برأس x-cron-secret وحده. والحارس في السطر 56.
[functions.notify-favorites]
verify_jwt = false

# ── والباقيات ────────────────────────────────────────────────────────────
# الستّ التالية تعمل على الخادم بـverify_jwt=false ولم يكن الملفّ يعلنها —
# نفسُ الفخّ الذي كاد يقتل بوت تيليجرام: أوّل نشرٍ من المستودع يضبطها على
# الافتراضي true، فتُردّ بـ401 قبل أن تصل شيفرتها. أُعلنت كلّها فلا يبقى
# فخٌّ صامت.

# واتساب لا يرسل Authorization؛ والحارس توقيع HMAC من ميتا.
[functions.whatsapp]
verify_jwt = false

# يناديها المتصفّح قبل الدخول — فلا جلسة بعدُ لتُوقَّع.
[functions.otp]
verify_jwt = false

# ينادَى من المتصفّح بمفتاح anon، والحارس رمزُ الإدارة داخلها.
[functions.admin-alert]
verify_jwt = false

[functions.broadcast]
verify_jwt = false

# تفتح الرقم للمسافر خارج مدينته — بلا حساب، فبلا JWT.
[functions.station-phone]
verify_jwt = false

[functions.test-push]
verify_jwt = false
